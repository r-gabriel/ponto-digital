{% extends 'base.html' %}

{% block titulo %}Login — Ponto Digital{% endblock %}

{% block conteudo %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #1e0a3c, #6c2bd9);">
    <div style="width: 100%; max-width: 400px; padding: 16px;">
        <div class="pd-card text-center">
            <div class="mb-4">
                <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
                     style="width:56px;height:56px;background:#ede9fe;border-radius:16px;">
                    <i class="bi bi-clock-history" style="font-size:1.6rem;color:#6c2bd9;"></i>
                </div>
                <h4 class="fw-700 mb-1" style="color:#1e1b2e;">Ponto Digital</h4>
                <p class="mb-0" style="font-size:.85rem;color:#6b7280;">
                    Entre com suas credenciais
                </p>
            </div>

            {% if form.errors %}
                <div class="pd-alert pd-alert-danger mb-3">
                    <i class="bi bi-exclamation-circle"></i> Usuário ou senha inválidos.
                </div>
            {% endif %}

            <form method="post" class="text-start">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-pd-primary w-100">
                    Entrar <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
