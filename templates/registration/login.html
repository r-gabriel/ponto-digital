<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Ponto Digital</title>
</head>
<body>
    <h1>Login</h1>

    {% if form.errors %}
        <p style="color:red;">Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuário:</label>
        {{ form.username }}<br>

        <label for="id_password">Senha:</label>
        {{ form.password }}<br>

        <button type="submit">Entrar</button>
    </form>
</body>
</html>
