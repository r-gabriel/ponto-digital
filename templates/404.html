<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Ponto Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f6f3ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .wrap {
            text-align: center;
            max-width: 360px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #4c1d95;
            font-weight: 600;
            font-size: .85rem;
            letter-spacing: .08em;
            margin-bottom: 24px;
        }

        .brand-badge {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4c1d95, #6c2bd9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .85rem;
        }

        .num-404 {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            color: #4c1d95;
            opacity: .12;
            letter-spacing: -6px;
            margin-bottom: 16px;
        }

        .icon-wrap {
            font-size: 2rem;
            color: #6c2bd9;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }

        .desc {
            font-size: .88rem;
            color: #6b7280;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="wrap">

        <a href="/" class="brand">
            <div class="brand-badge"><i class="bi bi-clock-history"></i></div>
            PONTO DIGITAL
        </a>

        <div class="num-404">404</div>

        <div class="title">Página não encontrada</div>
        <p class="desc">A página que você está procurando não existe ou foi movida.</p>

    </div>

</body>
</html>
